name: unpack-zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f match-predictor.zip || { echo "Upload match-predictor.zip first"; exit 1; }
          for f in *; do
            if [ -f "$f" ]; then
              case "$f" in match-predictor.zip|README.md|app.py|requirements.txt) ;; *) git rm -qf -- "$f" ;; esac
            fi
          done
          unzip -oq match-predictor.zip -x ".github/*"
          git rm -qf match-predictor.zip
          git config user.name "unpack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project into folders"
          git push
